<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f7f5"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <text x="540" y="120" text-anchor="middle" font-size="34" font-weight="700" fill="#10b981" letter-spacing="3">VANTAGEM 03</text>

  <text x="540" y="290" text-anchor="middle" font-size="92" font-weight="800" fill="#0f172a">5 minutos de áudio</text>
  <text x="540" y="390" text-anchor="middle" font-size="92" font-weight="800" fill="#10b981">em 3 linhas.</text>

  <!-- comparação visual: áudio longo vs resumo -->
  <g transform="translate(120,480)">
    <text x="0" y="0" font-size="30" font-weight="700" fill="#64748b">😮‍💨 Antes</text>
    <rect x="0" y="24" width="380" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="0" y="56" width="380" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="0" y="88" width="380" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="0" y="120" width="380" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="0" y="152" width="260" height="14" rx="7" fill="#e2e8f0"/>
    <text x="0" y="210" font-size="26" font-weight="500" fill="#94a3b8">5 min ouvindo tudo</text>
  </g>
  <g transform="translate(600,480)">
    <text x="0" y="0" font-size="30" font-weight="700" fill="#34d399">⚡ Com ZapScript</text>
