# render.yaml — ZapScript Blueprint v2
# Documentação: https://render.com/docs/blueprint-spec
#
# COMO USAR:
#   1. https://dashboard.render.com → "New" → "Blueprint"
#   2. Conectar este repositório GitHub
#   3. Render cria os 3 serviços automaticamente
#   4. Configurar as variáveis marcadas "sync: false" no Environment de cada serviço
#   5. Cada push na branch "master" faz deploy automático
#
# CUSTO ESTIMADO:
#   3 serviços × $7/mês (Starter) = ~$21/mês
#   Plano Free dorme após 15 min de inatividade — NÃO usar em produção

services:

  # ── API (Fastify + Socket.IO) ─────────────────────────────────────────────
  - type: web
    name: zapscript-api
    runtime: node
    # Sem rootDir → Render usa a raiz do repo; o build acessa packages/database
    buildCommand: cd apps/api && npm ci && npm run build
    startCommand: >
      cd apps/api &&
      npx prisma migrate deploy
        --schema=../../packages/database/prisma/schema.prisma &&
      node dist/index.js
    region: oregon
    plan: starter
    branch: master
    nodeVersion: 20
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render define PORT automaticamente — a API lê process.env.PORT || 3001

      # ── Banco de dados ──────────────────────────────────────────────────────
      # DATABASE_URL: connection pooler do Supabase
      #   postgresql://postgres.SEU_PROJECT:SENHA@aws-1-sa-east-1.pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        sync: false
      # DIRECT_URL: conexão direta para migrations (sem pooler)
      #   postgresql://postgres:SENHA@db.SEU_PROJECT.supabase.co:5432/postgres
      - key: DIRECT_URL
        sync: false

      # ── Redis (Upstash) ─────────────────────────────────────────────────────
      # rediss://default:SENHA@lasting-spider-XXXXX.upstash.io:6379
      - key: REDIS_URL
        sync: false

      # ── Autenticação / Segurança ────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false          # string aleatória 64+ chars
      - key: ENCRYPTION_KEY
        sync: false          # exatamente 64 hex chars (32 bytes)
      - key: INTERNAL_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: INTERNAL_API_SECRET
        sync: false

      # ── URLs da aplicação ───────────────────────────────────────────────────
      - key: APP_URL
        sync: false          # ex: https://zapscript.me (ou domínio Render)
      - key: API_URL
        sync: false          # ex: https://zapscript-api.onrender.com

      # ── Supabase Storage ────────────────────────────────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # ── IA / Transcrição (demo pública /demo/transcribe + agente de suporte) ──
      # A rota da demo roda NESTE serviço (API) e usa Groq Whisper + Claude.
      # Sem estas chaves, /demo/transcribe responde 503. Mesmos valores do worker.
      - key: GROQ_API_KEY
        sync: false          # whisper-large-v3-turbo
      - key: ANTHROPIC_API_KEY
        sync: false          # claude-3-haiku (resumo da demo)

      # ── Evolution API (WhatsApp) ────────────────────────────────────────────
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_WEBHOOK_SECRET
        sync: false

      # ── Pagamentos Asaas ────────────────────────────────────────────────────
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_BASE_URL
        value: https://api.asaas.com/v3
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false

      # ── E-mail (Resend) ─────────────────────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false

      # ── Suporte / Admin ─────────────────────────────────────────────────────
      - key: ADMIN_NOTIFY_PHONE
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false          # mesmo valor de REDIS_URL


  # ── Worker (BullMQ + Whisper + Claude) ────────────────────────────────────
  - type: worker
    name: zapscript-worker
    runtime: node
    buildCommand: cd apps/worker && npm ci && npm run build
    startCommand: cd apps/worker && node dist/index.js
    region: oregon
    plan: starter
    branch: master
    nodeVersion: 20
    envVars:
      - key: NODE_ENV
        value: production

      # ── Banco de dados ──────────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # ── Redis ───────────────────────────────────────────────────────────────
      - key: REDIS_URL
        sync: false

      # ── Segurança ───────────────────────────────────────────────────────────
      - key: ENCRYPTION_KEY
        sync: false
      - key: INTERNAL_TOKEN
        sync: false

      # ── IA / Transcrição ────────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false          # whisper-large-v3-turbo
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── Evolution API ───────────────────────────────────────────────────────
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_WEBHOOK_SECRET
        sync: false

      # ── Supabase Storage (uploads de áudio + anexos de suporte) ────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # ── Configurações ───────────────────────────────────────────────────────
      - key: WORKER_CONCURRENCY
        value: "4"
      - key: WORKER_LOCK_MINUTES
        value: "10"
      - key: API_URL
        sync: false          # para callbacks internos


  # ── Web (Next.js) ──────────────────────────────────────────────────────────
  - type: web
    name: zapscript-web
    runtime: node
    rootDir: apps/web        # app standalone — não usa packages/database
    buildCommand: npm ci && npm run build
    startCommand: npm start
    region: oregon
    plan: starter
    branch: master
    nodeVersion: 20
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: ZapScript

      # IMPORTANTE: NEXT_PUBLIC_* precisam estar definidas ANTES do build
      # (o Next.js as incorpora no bundle durante 'next build')

      # ── API pública ─────────────────────────────────────────────────────────
      - key: NEXT_PUBLIC_API_URL
        sync: false          # ex: https://zapscript-api.onrender.com
      - key: NEXT_PUBLIC_BASE_URL
        sync: false          # ex: https://zapscript.me (ou domínio Render)

      # ── Supabase Storage (acesso direto do browser) ─────────────────────────
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
