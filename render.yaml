# render.yaml — Blueprint de infraestrutura do ZapScript no Render.
#
# Migração de volta Vultr → Render (ver MIGRACAO_RENDER.md para o runbook
# completo). Decisão de negócio: aceita o custo maior (~$44/mês a mais que
# o Vultr, ver MIGRACAO_VULTR.md) em troca de infra gerenciada.
#
# Este Blueprint cobre só api + worker + redis. O Evolution API (WhatsApp)
# é criado À MÃO pelo dashboard, fora deste arquivo — ver o bloco de
# comentário "Evolution API — FORA deste Blueprint" no fim do arquivo pro
# passo a passo. Não é um objetivo de design, foi resposta a uma combinação
# (imagem pronta + disco persistente + serviço privado) que gerou vários
# erros de schema difíceis de acertar às cegas sem acesso à documentação
# completa do Render neste ambiente.
#
# RISCO CONHECIDO E ACEITO: o Render não tem região no Brasil (mais perto:
# Virginia/Ohio/Oregon nos EUA, ou Frankfurt). O `zapscript-evolution`
# conecta números de WhatsApp via Baileys a partir de um IP de datacenter
# fora do Brasil — isso pode reativar o aviso de fraude/golpe do WhatsApp
# que a Vultr São Paulo evitava (ver deploy/evolution-oci/README.md, que
# documenta esse diagnóstico). Decisão consciente de quem pediu a migração;
# se o aviso voltar, a mitigação é mover só o `evolution` para um host
# brasileiro (Vultr atual dimensionado só pra isso, ou finalizar o piloto
# OCI em deploy/evolution-oci/) — os outros serviços continuam no Render.
#
# Região: virginia (us-east) em todos os serviços — menor latência para
# usuários no Brasil entre as regiões disponíveis no Render.
#
# autoDeploy: false em todos de propósito — o deploy é disparado manualmente
# via .github/workflows/ops-render.yml (mesmo padrão de controle que o
# ops.yml já usa pro Vultr: build, espera healthcheck, só então promove).
# Isso evita que um push direto no master derrube produção sem passar pelo
# gate de healthcheck.
#
# Setup inicial (só uma vez, manual — API key sozinha não conecta o GitHub):
#   1. dashboard.render.com → New → Blueprint → conectar
#      foxtecnologiaonline/zapscript → branch master → Apply (cria api,
#      worker e redis)
#   2. New → Private Service → criar o zapscript-evolution à mão (ver o
#      bloco de comentário no fim deste arquivo)
#   3. Preencher os secrets do grupo `zapscript-secrets`, incluindo
#      EVOLUTION_API_URL com o endereço interno que o Render mostrou pro
#      evolution no passo 2 (ver MIGRACAO_RENDER.md para a lista completa
#      com origem de cada valor no .env atual da Vultr)
#   4. Depois disso, o dia a dia é 100% via ops-render.yml (Actions →
#      "Ops — Render" → Run workflow)

envVarGroups:
  - name: zapscript-secrets
    envVars:
      # ── Núcleo / segredos internos ──────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Supabase → Settings → Database → Connection String (URI)
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: INTERNAL_TOKEN
        sync: false
      - key: INTERNAL_API_SECRET
        sync: false
      - key: MONITOR_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: ADMIN_INSTANCE_NAME
        sync: false
      - key: ADMIN_NOTIFY_PHONE
        sync: false

      # ── Supabase ──────────────────────────────────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # ── IA ────────────────────────────────────────────────────────────
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ATENDE_AGENT_MODEL
        sync: false
      - key: SUPPORT_AGENT_MODEL
        sync: false
      - key: VOICE_COMMAND_AGENT_MODEL
        sync: false

      # ── WhatsApp — Evolution API (self-hosted, ver serviço `evolution`) ─
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_WEBHOOK_SECRET
        sync: false
      - key: SUPPORT_EVOLUTION_INSTANCE
        sync: false
      - key: SUPPORT_EVOLUTION_WEBHOOK_SECRET
        sync: false
      - key: SUPPORT_WELCOME_MSG
        sync: false

      # ── WhatsApp — API Oficial (Meta Cloud API) ─────────────────────────
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WEBHOOK_TOKEN
        sync: false
      - key: WHATSAPP_AUTO_REPLY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_GRAPH_VERSION
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false

      # ── WhatsApp — Twilio ────────────────────────────────────────────────
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_DEFAULT_USER_ID
        sync: false

      # ── WhatsApp — Z-API ──────────────────────────────────────────────────
      - key: ZAPI_TOKEN
        sync: false
      - key: ZAPI_CLIENT_TOKEN
        sync: false
      - key: ZAPI_INSTANCE_ID
        sync: false
      - key: ZAPI_DEFAULT_USER_ID
        sync: false
      - key: ZAPI_WEBHOOK_CLIENT_TOKEN
        sync: false

      # ── Pagamentos (Asaas) ────────────────────────────────────────────
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: ASAAS_BASE_URL
        sync: false

      # ── App / CORS ────────────────────────────────────────────────────
      - key: APP_NAME
        sync: false
      - key: APP_URL
        value: https://zapscript.me
      - key: EXTRA_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: SENTRY_DSN
        sync: false

      # ── E-mail ────────────────────────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false

      # ── Limites / cotas / comissão (não-secretos, mas variam por ambiente) ─
      - key: AUDIO_CHUNK_SEC
        sync: false
      - key: FFMPEG_TIMEOUT_MS
        value: "300000"
      - key: FREE_AUDIO_QUOTA
        sync: false
      - key: MAX_AUDIO_MARGIN_SECONDS
        sync: false
      - key: MAX_AUDIO_SECONDS
        sync: false
      - key: PRO_AUDIO_CAP
        sync: false
      - key: COMMISSION_BASE
        sync: false
      - key: COMMISSION_BONUS
        sync: false
      - key: COMMISSION_RESIDUAL
        sync: false
      - key: CREDIT_RATE
        sync: false

      # ── Concorrência dos workers por módulo ──────────────────────────────
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: WORKER_LOCK_MINUTES
        value: "5"
      - key: ATENDE_WORKER_CONCURRENCY
        sync: false
      - key: CAMPANHAS_WORKER_CONCURRENCY
        sync: false
      - key: LEGENDA_WORKER_CONCURRENCY
        sync: false
      - key: VOICE_COMMAND_WORKER_CONCURRENCY
        sync: false

services:
  # ── Fastify API ───────────────────────────────────────────────────────
  - type: web
    name: zapscript-api
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - fromGroup: zapscript-secrets
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zapscript-redis
          property: connectionString
      # zapscript-evolution NÃO faz parte deste Blueprint (criado à mão
      # pelo dashboard — ver "Evolution API" no fim deste arquivo e
      # MIGRACAO_RENDER.md), então não dá pra resolver via fromService.
      # Preencher com o endereço interno que o Render mostra na página do
      # serviço evolution depois de criado (formato http://<hostname>:<porta>).
      - key: EVOLUTION_API_URL
        sync: false

  # ── BullMQ Worker ─────────────────────────────────────────────────────
  - type: worker
    name: zapscript-worker
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: apps/worker/Dockerfile
    dockerContext: .
    autoDeploy: false
    envVars:
      - fromGroup: zapscript-secrets
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zapscript-redis
          property: connectionString
      - key: API_URL
        fromService:
          type: web
          name: zapscript-api
          property: hostport
      # Ver nota equivalente no serviço `api` acima — evolution é manual.
      - key: EVOLUTION_API_URL
        sync: false

  # ── Redis (BullMQ) ────────────────────────────────────────────────────
  # noeviction é obrigatório — BullMQ perde jobs silenciosamente com
  # qualquer outra política de eviction sob pressão de memória.
  - type: keyvalue
    name: zapscript-redis
    plan: starter
    region: virginia
    maxmemoryPolicy: noeviction
    ipAllowList: []

# ── Evolution API — FORA deste Blueprint, criado à mão ──────────────────────
#
# A combinação imagem-pronta + disco persistente + serviço privado deu vários
# erros de schema quando tentada aqui (ver histórico de commits deste
# arquivo) — em vez de continuar adivinhando, esse serviço passou a ser
# criado direto pelo dashboard. Passo a passo (ver também MIGRACAO_RENDER.md):
#
#   dashboard.render.com → New → Private Service
#     Nome: zapscript-evolution   (tem que ser esse nome — ops-render.yml e
#                                  os comentários de EVOLUTION_API_URL acima
#                                  esperam esse nome exato)
#     Deploy from: Existing Image
#     Image URL: atendai/evolution-api:latest
#     Region: Virginia
#     Plan: Starter (ou o que cobrir 1 GB de disco)
#     Disk: name=evolution-instances, mount path=/evolution/instances, 1 GB
#     Environment:
#       SERVER_URL=https://api.zapscript.me
#       AUTHENTICATION_TYPE=apikey
#       AUTHENTICATION_API_KEY=<mesmo valor de EVOLUTION_API_KEY do grupo
#                               zapscript-secrets — precisa bater nos dois
#                               lugares>
#       AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=false
#       DATABASE_ENABLED=false
#       REDIS_ENABLED=false
#       WEBHOOK_GLOBAL_ENABLED=false
#       DEL_INSTANCE=false
#       QRCODE_LIMIT=10
#
# Depois de criado, o Render mostra o endereço interno na própria página do
# serviço — copiar esse valor (formato http://<host>:<porta>) pros campos
# EVOLUTION_API_URL (sync: false) dos serviços `api` e `worker` acima.
