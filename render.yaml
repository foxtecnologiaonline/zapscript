services:
  # ── API (Fastify + Socket.IO) ────────────────────────────────
  - type: web
    name: zapscript-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy --schema=../../packages/database/prisma/schema.prisma && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Set these in the Render dashboard (Environment tab):
      # DATABASE_URL        — Supabase pooler URL (?pgbouncer=true&connection_limit=1)
      # DIRECT_URL          — Supabase direct URL (port 5432, no pgbouncer) — required for prisma migrate
      # REDIS_URL           — Upstash Redis URL (rediss://...)
      # JWT_SECRET          — 64+ char random string
      # ENCRYPTION_KEY      — exactly 64 hex characters (32 bytes)
      # SUPABASE_URL        — https://xxx.supabase.co
      # SUPABASE_SERVICE_KEY — service_role key from Supabase
      # APP_URL             — https://zapscript.me
      # ASAAS_API_KEY       — Asaas API key
      # ASAAS_WEBHOOK_TOKEN — token for Asaas webhook verification
      # INTERNAL_TOKEN      — shared secret with worker
      # ADMIN_TOKEN         — admin panel access token
      # MONITOR_TOKEN       — monitor agent token
      # SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS (optional, for emails)
      # SUPPORT_EMAIL       — where support tickets go (optional)
      # EVOLUTION_API_URL   — https://<vps-ip-ou-dominio>:8080 (Evolution API no Hostinger VPS)
      # EVOLUTION_API_KEY   — chave da Evolution API
      # ADMIN_WHATSAPP      — número do admin para alertas (ex: 5534991790254)
      #
      # ── Scaling notes ──────────────────────────────────────────────────────────
      # Para escalar o API para N pods (numInstances: N), o Socket.IO Redis adapter
      # já está configurado (usa REDIS_URL). Ative com:
      #   scaling:
      #     minInstances: 1
      #     maxInstances: 3   # aumentar conforme demanda
      # O Worker (BullMQ) já é multi-instância safe — pode ter múltiplos pods sem config extra.

  # ── Worker (BullMQ + Whisper + Claude) ──────────────────────
  - type: worker
    name: zapscript-worker
    runtime: node
    rootDir: apps/worker
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (Environment tab):
      # DATABASE_URL        — same Supabase pooler connection string
      # REDIS_URL           — same Upstash Redis URL
      # OPENAI_API_KEY      — OpenAI key (for Whisper transcription)
      # ANTHROPIC_API_KEY   — Anthropic key (for Claude bullets)
      # INTERNAL_TOKEN      — same as API's INTERNAL_TOKEN
      # API_URL             — https://zapscript.onrender.com
