version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: zapscript-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-zapscript}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zapscript-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: zapscript-redis
    # M5: Redis com senha mesmo em dev — evita acesso não autorizado em ambientes compartilhados
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-zapscript_dev_redis_2024}
      --bind 127.0.0.1 0.0.0.0
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zapscript-network

  # Fastify API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: zapscript-api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-zapscript}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      MONITOR_TOKEN: ${MONITOR_TOKEN}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ASAAS_API_KEY: ${ASAAS_API_KEY}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - /app/node_modules
    command: npm run dev --workspace=api
    networks:
      - zapscript-network
    restart: unless-stopped

  # BullMQ Worker
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: zapscript-worker
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-zapscript}
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      API_URL: http://api:3001
      FFMPEG_TIMEOUT_MS: ${FFMPEG_TIMEOUT_MS:-300000}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./apps/worker/src:/app/apps/worker/src
      - /app/node_modules
    command: npm run dev --workspace=worker
    networks:
      - zapscript-network
    restart: unless-stopped

  # Next.js Web App
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: zapscript-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - /app/node_modules
    command: npm run dev --workspace=web
    networks:
      - zapscript-network
    restart: unless-stopped

  # Monitor Agent
  monitor:
    build:
      context: .
      dockerfile: apps/monitor/Dockerfile
    container_name: zapscript-monitor
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-zapscript}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      API_URL: http://api:3001
      DASHBOARD_URL: http://web:3000
      ALERT_EMAIL: ${ALERT_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MONITOR_TOKEN: ${MONITOR_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./apps/monitor/src:/app/apps/monitor/src
      - /app/node_modules
    command: npm run dev --workspace=monitor
    networks:
      - zapscript-network
    restart: unless-stopped

networks:
  zapscript-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
