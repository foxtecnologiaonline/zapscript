# build-and-push.yml — Publica as imagens Docker (API + Worker) no GitHub
# Container Registry, SOB DEMANDA (workflow_dispatch).
#
# Usa o token automático do próprio GitHub Actions (GITHUB_TOKEN) — não precisa
# de nenhum Personal Access Token guardado como secret.
#
# IMPORTANTE: o deploy real (ops.yml, action=deploy) NÃO usa essas imagens —
# ele clona o master e builda direto no servidor Vultr, ignorando o ghcr.io
# por completo (ver CLAUDE.md). Este workflow rodava em todo push em master
# só para publicar imagens que nada consumia, gastando minutos de CI à toa —
# por isso o gatilho automático foi removido. Mantido como workflow_dispatch
# manual caso um dia o ops.yml passe a fazer `docker compose pull` em vez de
# buildar no servidor (aí sim essas imagens passam a ser úteis).

name: Build & Push Docker images

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push — API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/foxtecnologiaonline/zapscript-api:latest
            ghcr.io/foxtecnologiaonline/zapscript-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push — Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/foxtecnologiaonline/zapscript-worker:latest
            ghcr.io/foxtecnologiaonline/zapscript-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
