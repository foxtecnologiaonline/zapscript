# build-and-push.yml — Publica as imagens Docker (API + Worker) no GitHub
# Container Registry a cada push em master, sem precisar rodar
# scripts/build-and-push.sh manualmente no seu computador.
#
# Usa o token automático do próprio GitHub Actions (GITHUB_TOKEN) — não precisa
# de nenhum Personal Access Token guardado como secret.
#
# Depois que este workflow terminar, no Vultr basta:
#   cd /opt/zapscript && docker compose pull && docker compose up -d

name: Build & Push Docker images

on:
  push:
    branches: [master]
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'packages/database/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push — API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/foxtecnologiaonline/zapscript-api:latest
            ghcr.io/foxtecnologiaonline/zapscript-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push — Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/foxtecnologiaonline/zapscript-worker:latest
            ghcr.io/foxtecnologiaonline/zapscript-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
