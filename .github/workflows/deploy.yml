name: Build & Deploy → Vultr São Paulo

on:
  push:
    branches: [master]
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'packages/database/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push — API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/foxtecnologiaonline/zapscript-api:latest

      - name: Build e push — Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ghcr.io/foxtecnologiaonline/zapscript-worker:latest

  deploy:
    name: Deploy Vultr São Paulo
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: SSH → pull e restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: root
          key: ${{ secrets.VULTR_SSH_KEY }}
          script: |
            cd /opt/zapscript
            docker compose pull api worker
            docker compose up -d --no-deps api worker
            docker image prune -f
            echo "✅ Deploy $(date '+%Y-%m-%d %H:%M:%S BRT')"
