# deploy.yml — Render auto-deploy via Branch Tracking
#
# O Render monitora a branch "master" diretamente.
# Este workflow apenas valida o build antes do merge/push,
# garantindo que código com erro não chegue à branch principal.
#
# O deploy para o Render acontece automaticamente quando
# o push chega na branch master — sem necessidade de SSH
# ou Docker Hub. O Render faz o build pelo próprio render.yaml.

name: CI — Validate before deploy

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'apps/web/**'
      - 'packages/database/**'
      - 'render.yaml'
  pull_request:
    branches: [master, main]

jobs:
  validate:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/worker/package-lock.json
            apps/web/package-lock.json

      - name: Install & Build API
        run: |
          cd apps/api
          npm ci
          npm run build
        continue-on-error: false

      - name: Install & Build Worker
        run: |
          cd apps/worker
          npm ci
          npm run build
        continue-on-error: true   # não bloqueia deploy se worker tiver warning

      - name: Install & Build Web
        run: |
          cd apps/web
          npm ci
          npm run build
        env:
          # Vars fictícias para o build passar (Next.js precisa delas no build)
          NEXT_PUBLIC_API_URL: https://api.zapscript.me
          NEXT_PUBLIC_BASE_URL: https://zapscript.me
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_NAME: ZapScript
        continue-on-error: true   # não bloqueia — Web é deployado no Render separado

      - name: Summary
        if: always()
        run: |
          echo "✅ CI concluído — deploy automático no Render via branch tracking"
          echo "   Verifique: https://dashboard.render.com"
