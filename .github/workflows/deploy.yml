# deploy.yml — CI de validação (build & type check) antes do deploy real.
#
# Este workflow NÃO deploya nada — só garante que API, Worker e Web buildam
# sem erro antes do código chegar em master/main. O deploy de fato acontece
# em dois lugares separados, fora deste workflow:
#
#   Web (Next.js)   → Vercel. Integração Git nativa: todo push em master
#                      dispara build + deploy automático na Vercel — não
#                      depende do GitHub Actions.
#   API + Worker    → Vultr (Docker). O workflow build-and-push.yml builda
#                      e publica as imagens no ghcr.io a cada push em master
#                      (quando apps/api, apps/worker ou packages/database
#                      mudam). O deploy em si no servidor Vultr é manual,
#                      via workflow_dispatch do ops.yml (action=deploy), que
#                      faz SSH e roda `docker compose pull && up -d`.
#
# Render foi descomissionado (ver MIGRACAO_VULTR.md) — não use como
# referência para onde o deploy acontece.

name: CI — Validate before deploy

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'apps/web/**'
      - 'packages/database/**'
      - 'render.yaml'
  pull_request:
    branches: [master, main]

jobs:
  validate:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/worker/package-lock.json
            apps/web/package-lock.json

      - name: Install & Build API
        run: |
          cd apps/api
          npm ci
          npm run build
        continue-on-error: false

      - name: Install & Build Worker
        run: |
          cd apps/worker
          npm ci
          npm run build
        continue-on-error: true   # não bloqueia deploy se worker tiver warning

      - name: Install & Build Web
        run: |
          cd apps/web
          npm ci
          npm run build
        env:
          # Vars fictícias para o build passar (Next.js precisa delas no build)
          NEXT_PUBLIC_API_URL: https://api.zapscript.me
          NEXT_PUBLIC_BASE_URL: https://zapscript.me
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_NAME: ZapScript
        continue-on-error: true   # não bloqueia — a Vercel builda e deploya o Web por conta própria

      - name: Summary
        if: always()
        run: |
          echo "✅ CI de validação concluído."
          echo "   Web:        deploy automático na Vercel (integração Git nativa)."
          echo "   API/Worker: imagens publicadas em ghcr.io por build-and-push.yml;"
          echo "               deploy no Vultr é manual via ops.yml (workflow_dispatch, action=deploy)."
