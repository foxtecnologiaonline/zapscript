name: Deploy to Render

# Dispara a cada push no master (branch real do projeto) e manualmente
on:
  push:
    branches: [ master ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'render.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:   # Permite acionar manualmente pelo GitHub Actions UI

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy — API
        # RENDER_DEPLOY_HOOK_API: GitHub → Settings → Secrets → Actions
        # Valor: URL de deploy hook do serviço API no Render
        # Render → zapscript-api → Settings → Deploy Hook → copiar URL
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_API }}" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK_API não configurado. Pulando."
          else
            echo "🚀 Disparando deploy da API..."
            curl --fail-with-body -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"
            echo "✅ Deploy da API solicitado."
          fi

  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy — Worker
        # RENDER_DEPLOY_HOOK_WORKER: mesma coisa para o serviço zapscript-worker
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK_WORKER não configurado. Pulando."
          else
            echo "🚀 Disparando deploy do Worker..."
            curl --fail-with-body -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}"
            echo "✅ Deploy do Worker solicitado."
          fi
