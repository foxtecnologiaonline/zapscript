# ops.yml — Ações operacionais disparadas manualmente (deploy no Vultr,
# migração de usuários para o Core, comando SSH avulso), sem precisar de
# acesso SSH direto de fora do GitHub Actions.
#
# Uso: aba Actions → "Ops — Vultr / Migração" → Run workflow → escolher a ação.
#
# Duas famílias de job, por necessidade real de rede:
#   - migrate_core_*: só precisa falar com Supabase (DATABASE_URL) e Asaas
#     (ASAAS_API_KEY) — roda direto no runner do GitHub, sem SSH nenhum.
#   - deploy / rollback / custom_ssh: precisa mesmo rodar no servidor (docker
#     build/compose, filesystem) — únicos casos que usam SSH.
#
# COMO O DEPLOY REALMENTE FUNCIONA NESTE SERVIDOR (não é "docker compose
# pull" — o servidor builda a imagem localmente a partir do código-fonte):
#   0. (runner do GitHub, antes de tocar no servidor) `prisma migrate deploy`
#      contra o Supabase via DATABASE_URL — aplica no schema "core" toda
#      migration do repo ainda pendente. Adicionado depois do incidente de
#      2026-09-09: até então este workflow nunca rodava isso, e uma migration
#      podia ficar semanas sem ser aplicada em produção enquanto o código que
#      já dependia dela ia sendo deployado — quebra silenciosa (a query cai
#      num catch(()=>null) em vários pontos), não um erro óbvio no deploy.
#      Falha aqui aborta o job ANTES do build/deploy — não faz sentido subir
#      código que espera um schema que não existe. Módulos que replicam
#      schema via runAutoMigrations() no boot da API (Copiloto, Cobrança,
#      Legendas etc.) continuam funcionando à parte disso, mas o padrão daqui
#      pra frente é: toda migration nova do Prisma passa por este passo.
#   1. git clone --depth 1 do master para /root/zapscript-build-new
#   2. docker build das imagens api/worker com tag :new (isolado — não toca
#      no que está rodando enquanto builda)
#   3. tag do :latest atual → :previous (rede de segurança pro rollback) —
#      nos DOIS nomes: o local (zapscript-api) e o que o compose de fato usa
#      (ghcr.io/foxtecnologiaonline/zapscript-api — ver nota abaixo)
#   4. tag do :new → :latest, idem nos dois nomes
#   5. sobe a api primeiro e espera o healthcheck ficar "healthy" via polling
#      real (não um sleep fixo — o healthcheck da api pode levar 30-90s,
#      e um sleep curto demais deixa o worker preso em "Created" porque ele
#      tem depends_on: condition: service_healthy)
#   6. só then sobe o worker
#   7. limpa a tag :new e promove /root/zapscript-build-new a
#      /root/zapscript-build (guardando o anterior como -old)
#
# ⚠️ Nota sobre o nome da imagem (bug corrigido em 2026-09-04): o
# /root/docker-compose.zapscript.yml declara os serviços api/worker com
# `image: ghcr.io/foxtecnologiaonline/zapscript-api(-worker):latest` — não
# porque o compose puxa desse registry (`docker compose up -d` sem `--pull`
# nunca busca lá), mas porque foi assim que o arquivo ficou configurado uma
# vez e o Docker casa contêiner↔imagem pelo NOME exato, não pelo conteúdo.
# Buildar e marcar só `zapscript-api:latest` (sem o prefixo `ghcr.io/`) faz o
# `docker compose up -d` continuar de braços cruzados usando o que já estava
# em cache sob o nome `ghcr.io/...` — o deploy "funcionava" (build ok,
# healthcheck ok) sem publicar UMA linha de código nova. Por isso os dois
# blocos abaixo (deploy e rollback) marcam a imagem sob os dois nomes.
#
# Rollback (action = rollback) simplesmente inverte o passo 3/4: promove de
# volta a tag :previous → :latest e reinicia na mesma ordem (api, espera
# ficar healthy, worker).
#
# Configuração única (Settings → Secrets and variables → Actions):
#   VULTR_HOST     IP do servidor (ex.: 216.238.114.73)
#   VULTR_SSH_KEY  chave PRIVADA ed25519 dedicada a este workflow — gerar com
#                  `ssh-keygen -t ed25519 -f vultr_ops -C "github-actions-ops" -N ""`
#                  e adicionar o conteúdo de vultr_ops.pub em
#                  /root/.ssh/authorized_keys no servidor. NÃO reaproveitar
#                  a chave/senha de root existente — esta deve ser revogável
#                  isoladamente (remover a linha do authorized_keys encerra
#                  o acesso deste workflow sem afetar o resto).
#   DATABASE_URL   connection string do Supabase — pooler em modo TRANSACTION
#                  (porta 6543, pgbouncer=true; mesma do .env de produção) —
#                  usada pelos migrate_core_*, pelo `prisma migrate deploy`
#                  (só como datasource "url") e por qualquer outro uso futuro
#                  que precise falar com o Postgres direto do runner do GitHub.
#   DIRECT_URL     mesma connection string do Supabase, só que no pooler em
#                  modo SESSION (porta 5432, sem pgbouncer=true) — usada só
#                  pelo `prisma migrate deploy` (datasource "directUrl"; ver
#                  comentário no passo). Modo transaction não suporta o
#                  advisory lock que o migrate usa internamente e trava pra
#                  sempre sem erro (visto no run #84, 2026-09-09). Mesmo
#                  usuário/senha/database de DATABASE_URL — manter os dois em
#                  sincronia manualmente quando a credencial do Supabase mudar.
#   ASAAS_API_KEY  necessária só para o action = migrate_core_apply

name: Ops — Vultr / Migração

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'O que rodar'
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - rollback
          - migrate_core_dry_run
          - migrate_core_apply
          - custom_ssh
      custom_command:
        description: 'Comando shell remoto (usado só quando action = custom_ssh)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  # ── Migração de usuários para o Core — sem SSH, roda no runner mesmo. ──
  migrate:
    if: inputs.action == 'migrate_core_dry_run' || inputs.action == 'migrate_core_apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependência do script (pg)
        run: npm install pg --prefix scripts_temp --silent

      - name: Dry-run (padrão — nada é alterado)
        if: inputs.action == 'migrate_core_dry_run'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/migrate-users-to-core.mjs

      - name: Aplicar de verdade
        if: inputs.action == 'migrate_core_apply'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
        run: node scripts/migrate-users-to-core.mjs --apply --i-understand-this-cancels-paid-subscriptions

  # ── Deploy, rollback e comandos avulsos — únicos que precisam do servidor. ──
  remote-ssh:
    if: inputs.action == 'deploy' || inputs.action == 'rollback' || inputs.action == 'custom_ssh'
    runs-on: ubuntu-latest
    # Trava de concorrência: build/deploy usa um diretório fixo no servidor
    # (/root/zapscript-build-new) — dois runs em paralelo colidem nele (um
    # apaga/move o diretório enquanto o outro ainda está "cd"ado lá dentro,
    # gerando erro de "getwd: no such file or directory" no meio do deploy).
    # cancel-in-progress: false — o run mais novo espera na fila em vez de
    # cancelar um deploy em andamento (cancelar no meio poderia deixar api/
    # worker em versões diferentes).
    concurrency:
      group: ops-vultr-remote-ssh
      cancel-in-progress: false
    steps:
      - name: Checkout (schema Prisma)
        if: inputs.action == 'deploy'
        uses: actions/checkout@v4

      # Roda ANTES do build/deploy: aplica no schema "core" (Supabase, via
      # DATABASE_URL) toda migration do repo que ainda não foi aplicada.
      # Motivo de existir (incidente 2026-09-09): este workflow builda e sobe
      # as imagens direto no servidor, mas nunca rodava `prisma migrate
      # deploy` — só o "core" schema é migrável por aqui; módulos que
      # replicam schema via runAutoMigrations() no boot da API (Copiloto,
      # Cobrança, Legendas etc.) não dependem deste passo. Sem isso, código
      # que referencia uma coluna nova sem a migration correspondente
      # aplicada quebra em produção de forma silenciosa (query cai num
      # catch(() => null) em vários pontos do código) — foi exatamente o que
      # derrubou o roteamento do webhook do WhatsApp por horas no incidente
      # que motivou este passo (WhatsappNumber.publicPurpose ausente no banco).
      # Falha aqui interrompe o job antes de buildar/subir código novo — não
      # faz sentido subir uma versão que espera um schema que não existe.
      - name: Aplicar migrations Prisma pendentes (schema core)
        if: inputs.action == 'deploy'
        working-directory: packages/database
        # Sem timeout, um hang aqui (visto na prática: nem chega a logar "Prisma
        # schema loaded" — trava antes disso, provavelmente resolvendo o pacote
        # via npx, não a conexão em si) prende o job "in_progress" por dezenas de
        # minutos SEM nenhuma sessão aberta no Postgres (conferido via
        # pg_stat_activity) — e como o job seguinte (remote-ssh) usa o mesmo
        # concurrency group (ops-vultr-remote-ssh, cancel-in-progress: false),
        # todo deploy novo fica preso na fila atrás dele até alguém cancelar à
        # mão. 5 min é generoso (o caso normal — sucesso ou falha de auth —
        # sempre resolveu em menos de 1 min nos runs observados).
        timeout-minutes: 5
        # schema.prisma declara datasource com url + directUrl. DATABASE_URL é
        # o pooler Supabase em modo TRANSACTION (porta 6543, pgbouncer=true) —
        # usado em produção pela API/Worker, mas incompatível com o advisory
        # lock que o motor do Prisma Migrate usa internamente: conecta normal
        # ("Datasource db..." loga certinho) e trava pra sempre depois, sem
        # erro nenhum (confirmado no run #84, 2026-09-09 — travou os 5min do
        # timeout). DIRECT_URL é o secret separado com a mesma connection
        # string em modo SESSION (porta 5432, sem pgbouncer=true), que suporta
        # o lock — precisa ser mantido em sincronia manualmente com
        # DATABASE_URL (mesmo usuário/senha/database, só porta e parâmetro
        # diferentes) sempre que a credencial do Supabase mudar.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx --yes prisma@5.22.0 migrate deploy

      - name: Configurar chave SSH
        env:
          SSH_KEY:  ${{ secrets.VULTR_SSH_KEY }}
          SSH_HOST: ${{ secrets.VULTR_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Montar comando
        id: cmd
        env:
          ACTION: ${{ inputs.action }}
          CUSTOM: ${{ inputs.custom_command }}
        run: |
          if [ "$ACTION" = "deploy" ]; then
            CMD=$(cat <<'REMOTE'
          set -e
          BUILD_DIR=/root/zapscript-build
          NEW_DIR=/root/zapscript-build-new
          OLD_DIR=/root/zapscript-build-old
          COMPOSE_FILE=/root/docker-compose.zapscript.yml

          echo "== clonando master =="
          rm -rf "$NEW_DIR"
          git clone --depth 1 --branch master https://github.com/foxtecnologiaonline/zapscript.git "$NEW_DIR"
          cd "$NEW_DIR"
          git log -1 --oneline

          echo "== build api =="
          docker build -f apps/api/Dockerfile -t zapscript-api:new .
          echo "== build worker =="
          docker build -f apps/worker/Dockerfile -t zapscript-worker:new .

          GHCR_API=ghcr.io/foxtecnologiaonline/zapscript-api
          GHCR_WORKER=ghcr.io/foxtecnologiaonline/zapscript-worker

          # Guarda a versao anterior pro rollback, nos dois nomes — o local
          # (so pra debug/inspecao manual) e o que o compose de fato usa.
          docker tag zapscript-api:latest zapscript-api:previous 2>/dev/null || true
          docker tag zapscript-worker:latest zapscript-worker:previous 2>/dev/null || true
          docker tag "$GHCR_API:latest" "$GHCR_API:previous" 2>/dev/null || true
          docker tag "$GHCR_WORKER:latest" "$GHCR_WORKER:previous" 2>/dev/null || true

          docker tag zapscript-api:new zapscript-api:latest
          docker tag zapscript-worker:new zapscript-worker:latest
          # Essencial: e' esse nome (ghcr.io/...) que docker-compose.zapscript.yml
          # referencia — sem retaguear pra ele tambem, "docker compose up -d"
          # nao enxerga a imagem nova (ver nota no topo do arquivo).
          docker tag zapscript-api:new "$GHCR_API:latest"
          docker tag zapscript-worker:new "$GHCR_WORKER:latest"

          echo "== subindo api =="
          docker compose -f "$COMPOSE_FILE" up -d api
          echo "== aguardando api ficar healthy (poll, nao sleep fixo) =="
          for i in $(seq 1 100); do
            status=$(docker inspect --format='{{.State.Health.Status}}' zapscript-api 2>/dev/null || echo unknown)
            if [ "$status" = "healthy" ]; then echo "api healthy apos ${i}x5s"; break; fi
            if [ "$i" = "100" ]; then echo "TIMEOUT esperando api ficar healthy"; docker logs zapscript-api --tail 120; exit 1; fi
            sleep 5
          done

          echo "== subindo worker =="
          docker compose -f "$COMPOSE_FILE" up -d worker
          sleep 5
          docker compose -f "$COMPOSE_FILE" ps

          docker image rm zapscript-api:new zapscript-worker:new 2>/dev/null || true
          docker image prune -f
          rm -rf "$OLD_DIR"
          [ -d "$BUILD_DIR" ] && mv "$BUILD_DIR" "$OLD_DIR"
          mv "$NEW_DIR" "$BUILD_DIR"
          echo "DEPLOY_OK"
          REMOTE
          )
          elif [ "$ACTION" = "rollback" ]; then
            CMD=$(cat <<'REMOTE'
          set -e
          COMPOSE_FILE=/root/docker-compose.zapscript.yml
          GHCR_API=ghcr.io/foxtecnologiaonline/zapscript-api
          GHCR_WORKER=ghcr.io/foxtecnologiaonline/zapscript-worker

          # O compose casa pelo nome ghcr.io/... (ver nota no topo do arquivo)
          # — e' essa tag :previous que precisa existir pro rollback valer.
          if ! docker image inspect "$GHCR_API:previous" >/dev/null 2>&1; then
            echo "Sem imagem :previous salva — nao ha rollback disponivel (so existe apos um deploy via este workflow)."
            exit 1
          fi

          docker tag zapscript-api:previous zapscript-api:latest 2>/dev/null || true
          docker tag zapscript-worker:previous zapscript-worker:latest 2>/dev/null || true
          docker tag "$GHCR_API:previous" "$GHCR_API:latest"
          docker tag "$GHCR_WORKER:previous" "$GHCR_WORKER:latest"

          echo "== subindo api (versao anterior) =="
          docker compose -f "$COMPOSE_FILE" up -d api
          for i in $(seq 1 100); do
            status=$(docker inspect --format='{{.State.Health.Status}}' zapscript-api 2>/dev/null || echo unknown)
            if [ "$status" = "healthy" ]; then echo "api healthy apos ${i}x5s"; break; fi
            if [ "$i" = "100" ]; then echo "TIMEOUT esperando api ficar healthy"; docker logs zapscript-api --tail 120; exit 1; fi
            sleep 5
          done

          echo "== subindo worker (versao anterior) =="
          docker compose -f "$COMPOSE_FILE" up -d worker
          sleep 5
          docker compose -f "$COMPOSE_FILE" ps
          echo "ROLLBACK_OK"
          REMOTE
          )
          else
            CMD="$CUSTOM"
          fi
          {
            echo "cmd<<__EOF__"
            echo "$CMD"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Executar no Vultr
        env:
          SSH_HOST:   ${{ secrets.VULTR_HOST }}
          REMOTE_CMD: ${{ steps.cmd.outputs.cmd }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "root@$SSH_HOST" "$REMOTE_CMD"
