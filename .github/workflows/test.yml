name: Tests & Linting

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: zapscript_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      # v2.1 — corrigido (estava "npm ci" + "--workspaces", que nunca
      # funcionaram: o monorepo é pnpm (pnpm-workspace.yaml), sem
      # "workspaces" no package.json raiz que o npm entenda. Combinado com o
      # branch trigger errado (main/develop — este repo usa "master"), este
      # workflow nunca rodou de verdade desde que foi criado.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # schema.prisma declara datasource com url + directUrl (env("DIRECT_URL")
      # — ver packages/database/prisma/schema.prisma). Prisma resolve os dois
      # env() ao carregar o schema, pra QUALQUER comando — falta um dos dois e
      # já erra "Environment variable not found", mesmo em `generate`. Em
      # produção (ops.yml) os dois valores diferem (DATABASE_URL é o pooler
      # Supabase, DIRECT_URL a conexão direta); aqui é um Postgres local sem
      # pooler nenhum, então os dois apontam pro mesmo lugar.
      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/zapscript_test
          DIRECT_URL: postgresql://postgres:password@localhost:5432/zapscript_test
        run: pnpm --filter database exec prisma generate

      - name: Apply migrations (schema de teste)
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/zapscript_test
          DIRECT_URL: postgresql://postgres:password@localhost:5432/zapscript_test
        run: pnpm --filter database exec prisma migrate deploy

      - name: Lint
        run: pnpm -r run lint 2>/dev/null || true

      - name: Type-check
        run: |
          pnpm --filter api exec tsc --noEmit
          pnpm --filter worker exec tsc --noEmit

      - name: Run tests - API
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/zapscript_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-12345678901234567890
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          INTERNAL_TOKEN: test-internal-token
          MONITOR_TOKEN: test-monitor-token
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_KEY: test-service-key
          OPENAI_API_KEY: test-openai-key
          ANTHROPIC_API_KEY: test-anthropic-key
          ASAAS_API_KEY: test-asaas-key
          ASAAS_WEBHOOK_TOKEN: test-webhook-token
        run: pnpm --filter api test

      - name: Run tests - Worker
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/zapscript_test
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: test-openai-key
          ANTHROPIC_API_KEY: test-anthropic-key
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: pnpm --filter worker test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Tests passed! Ready to merge.'
            })
