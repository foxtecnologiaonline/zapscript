name: CI/CD Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'
  # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 removido — as actions (checkout/setup-node)
  # ainda não suportam Node.js 24 internamente; habilitar quando versões compatíveis
  # forem publicadas (previsto para set/2026)

jobs:
  # ── BUILD & DEPENDENCIES ──────────────────────────────────────
  build:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter api build

      - name: Build Worker
        run: pnpm --filter worker build
        continue-on-error: true

  # ── TYPE CHECKING ──────────────────────────────────────────────
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check API
        run: pnpm --filter api exec tsc --noEmit
        continue-on-error: true

      - name: Type check Worker
        run: pnpm --filter worker exec tsc --noEmit
        continue-on-error: true

  # ── UNIT TESTS ─────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: pnpm --filter api test -- --passWithNoTests
        continue-on-error: true

      - name: Run Worker tests
        run: pnpm --filter worker test -- --passWithNoTests
        continue-on-error: true

  # ── SECURITY AUDIT ─────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run audit
        run: pnpm audit --prod
        continue-on-error: true

  # ── SUMMARY & GATING ────────────────────────────────────────────
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [build, type-check, test, audit]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "⚠️  Tests failed or skipped (non-blocking)"
          fi
          echo "✅ CI Pipeline completed"
