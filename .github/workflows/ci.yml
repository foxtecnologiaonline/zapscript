name: CI/CD Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ── BUILD & DEPENDENCIES ──────────────────────────────────────
  build:
    name: Build & Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build --workspace=api

      - name: Build Worker
        run: npm run build --workspace=worker

      - name: Build Web
        run: npm run build --workspace=web

  # ── LINTING ────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --workspace=api || true
        continue-on-error: true

      - name: Check TypeScript
        run: npm run type-check --workspace=api
        continue-on-error: true

  # ── TYPE CHECKING ──────────────────────────────────────────────
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check API
        run: npx tsc --project apps/api/tsconfig.json --noEmit
        continue-on-error: true

      - name: Type check Worker
        run: npx tsc --project apps/worker/tsconfig.json --noEmit
        continue-on-error: true

  # ── UNIT TESTS ─────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test --workspace=api -- --coverage
        continue-on-error: true

      - name: Run Worker tests
        run: npm run test --workspace=worker -- --coverage
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/api/coverage/coverage-final.json,./apps/worker/coverage/coverage-final.json
          fail_ci_if_error: false
        continue-on-error: true

  # ── SECURITY: AUDIT ────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --production
        continue-on-error: true

  # ── SECURITY: SNYK ────────────────────────────────────────────
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: snyk/actions/setup@master
        with:
          snyk-version: latest

      - name: Run Snyk test
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

  # ── DOCKER BUILD (optional) ─────────────────────────────────────
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v2

      - name: Build API Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

      - name: Build Worker Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./apps/worker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  # ── SUMMARY & GATING ────────────────────────────────────────────
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [build, lint, type-check, test, audit]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "⚠️  Tests failed or skipped"
          fi
          echo "✅ CI Pipeline completed"
