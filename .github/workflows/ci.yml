name: CI/CD Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'
  # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 removido — as actions (checkout/setup-node)
  # ainda não suportam Node.js 24 internamente; habilitar quando versões compatíveis
  # forem publicadas (previsto para set/2026)

jobs:
  # ── BUILD & DEPENDENCIES ──────────────────────────────────────
  build:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gera o Prisma Client pelo pacote `database`: sob pnpm isso resolve o
      # @prisma/client via symlink e popula o store compartilhado (.pnpm/...),
      # que é exatamente o que o tsc da API lê ao seguir o symlink. Evita o
      # `prebuild` (npm install em packages/database) que cria um @prisma/client
      # real paralelo e desvia a geração para fora do store → TS2305.
      - name: Generate Prisma Client
        run: pnpm --filter database generate

      - name: Build API
        run: pnpm --filter api exec tsc

      - name: Build Worker
        run: pnpm --filter worker exec tsc

  # ── TYPE CHECKING ──────────────────────────────────────────────
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Necessário antes do tsc — mesmo motivo documentado no job Build acima
      # (sem isso, o tsc não resolve @prisma/client e falha com TS2305).
      - name: Generate Prisma Client
        run: pnpm --filter database generate

      - name: Type check API
        run: pnpm --filter api exec tsc --noEmit

      - name: Type check Worker
        run: pnpm --filter worker exec tsc --noEmit

  # ── UNIT TESTS ─────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    # Postgres + Redis reais: a suíte da API não é 100% mockada —
    # optin-system.test.ts exercita o fluxo de opt-in/opt-out contra o banco
    # de verdade (prisma.user.create/deleteMany etc.) e várias rotas abrem
    # conexão BullMQ no import. Sem estes services o job falhava em TODO push
    # (mesma suíte passa em test.yml, que já os declara) e derrubava o gate
    # "CI Status" junto, mesmo com build e type-check verdes.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: zapscript_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:password@localhost:5432/zapscript_test
      # schema.prisma declara datasource com url + directUrl; o Prisma resolve
      # os DOIS env() ao carregar o schema (inclusive em `generate`), então
      # faltar DIRECT_URL já quebra com "Environment variable not found".
      # Aqui é um Postgres local sem pooler — os dois apontam pro mesmo lugar.
      DIRECT_URL: postgresql://postgres:password@localhost:5432/zapscript_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-key-12345678901234567890
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      INTERNAL_TOKEN: test-internal-token
      MONITOR_TOKEN: test-monitor-token
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_KEY: test-service-key
      OPENAI_API_KEY: test-openai-key
      ANTHROPIC_API_KEY: test-anthropic-key
      ASAAS_API_KEY: test-asaas-key
      ASAAS_WEBHOOK_TOKEN: test-webhook-token
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter database exec prisma generate

      - name: Apply migrations (schema de teste)
        run: pnpm --filter database exec prisma migrate deploy

      - name: Run API tests
        run: pnpm --filter api test

      # Sem `if: always()` os testes do worker eram PULADOS sempre que a API
      # falhava — a suíte inteira do worker ficava sem rodar no CI.
      - name: Run Worker tests
        if: always()
        run: pnpm --filter worker test

      # A suíte do web nunca rodou em CI. Além dos testes de preço, é ela que
      # guarda o espelho de marketing da cota (freemium-mirror.test.ts) —
      # sem rodar aqui, o guard não guarda nada.
      - name: Run Web tests
        if: always()
        run: pnpm --filter web test

      # Herdado do test.yml, que este workflow substitui. Nunca bloqueia
      # (fail_ci_if_error: false) — cobertura é sinal, não gate.
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  # ── LOCKFILES NPM (o que Docker e Vercel realmente instalam) ───────────
  # O resto do CI usa pnpm + pnpm-lock.yaml, mas as imagens da API/Worker são
  # buildadas no servidor com `npm ci` (Dockerfile) e a Vercel instala o web com
  # `npm ci`. Os package-lock.json ficam fora do alcance do pnpm: já divergiram
  # (transitivas vulneráveis que o pnpm audit não via) e um peer opcional em
  # conflito (openai x zod 4) quebraria `npm ci` — erro que só apareceria no
  # deploy. Este job reproduz exatamente esse caminho. Substitui o antigo
  # deploy.yml ("CI — Validate before deploy"), que fazia o mesmo mas só em
  # push com filtro de paths, com Node 20 e com web/worker em continue-on-error —
  # e por isso não podia servir de gate para o ops.yml.
  npm-lockfiles:
    name: Lockfiles npm (Docker/Vercel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/worker/package-lock.json
            apps/web/package-lock.json
            apps/monitor/package-lock.json

      - name: API — npm ci + build
        run: |
          cd apps/api
          npm ci
          npm run build

      - name: Worker — npm ci + build
        run: |
          cd apps/worker
          npm ci
          npm run build

      - name: Web — npm ci + build
        run: |
          cd apps/web
          npm ci
          npm run build
        env:
          # Placeholders: o Next precisa destas NEXT_PUBLIC_* em tempo de build.
          NEXT_PUBLIC_API_URL: https://api.zapscript.me
          NEXT_PUBLIC_BASE_URL: https://zapscript.me
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_NAME: ZapScript

      - name: Monitor — npm ci
        run: cd apps/monitor && npm ci

      # Mesma política do job Security Audit: bloqueia em critical, relatório
      # completo sem gate. Aqui o alvo é o que de fato vai para produção.
      - name: npm audit (bloqueia em critical)
        run: |
          for app in api worker web monitor; do
            echo "== $app"
            (cd apps/$app && npm audit --omit=dev --audit-level=critical)
          done

      - name: npm audit — relatório completo (não bloqueia)
        if: always()
        run: |
          for app in api worker web monitor; do
            echo "== $app"
            (cd apps/$app && npm audit --omit=dev || true)
          done

  # ── SECURITY AUDIT ─────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bloqueante em 'critical': o audit rodava com continue-on-error e o job
      # passava verde mesmo achando RCE não autenticado — foi assim que dois
      # críticos do Next ficaram invisíveis. O nível fica em 'critical' de
      # propósito (e não em 'high') pra travar só o que é inegociável; o
      # relatório completo continua saindo no passo seguinte, sem gate.
      - name: Run audit (bloqueia em critical)
        run: pnpm audit --prod --audit-level critical

      - name: Relatório completo (não bloqueia)
        if: always()
        run: pnpm audit --prod || true

  # ── SUMMARY & GATING ────────────────────────────────────────────
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [build, type-check, test, audit, npm-lockfiles]
    if: always()
    steps:
      - name: Check status
        run: |
          fail=0
          check() { if [ "$2" != "success" ]; then echo "❌ $1: $2"; fail=1; fi; }
          check "Build" "${{ needs.build.result }}"
          check "Type check" "${{ needs.type-check.result }}"
          check "Tests" "${{ needs.test.result }}"
          check "Security audit" "${{ needs.audit.result }}"
          check "Lockfiles npm" "${{ needs.npm-lockfiles.result }}"
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "✅ CI Pipeline completed"
