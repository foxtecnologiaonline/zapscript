[build]
builder = "nixpacks"
buildCommand = "npm install -g pnpm && pnpm install && npx prisma generate --schema=packages/database/prisma/schema.prisma && pnpm --filter api build"

[deploy]
startCommand      = "node apps/api/dist/index.js"
healthcheckPath   = "/health"
healthcheckTimeout = 30
restartPolicyType = "always"
