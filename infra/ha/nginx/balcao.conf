# Nginx do Balcão Virtual — borda TLS com 2+ réplicas da API (alta disponibilidade).
# Instalação (host Vultr, nginx FORA do Docker, como em infra/nginx-zapscript.conf):
#   cp balcao.conf /etc/nginx/conf.d/balcao.conf     # (arquivos de conf.d já ficam dentro do bloco http{})
#   nginx -t && systemctl reload nginx
# Certificado: certbot em modo WEBROOT (/var/www/html) — NUNCA --standalone (ver CLAUDE.md, incidente 2026-11-20).
#   certbot certonly --webroot -w /var/www/html -d api.zapscript.me --cert-name api.zapscript.me
# As réplicas (docker-compose.ha.yml) publicam 127.0.0.1:3001 (api1) e 127.0.0.1:3002 (api2).
# No site de DR (outra região do Brasil) a mesma configuração vale, com os upstreams locais.

# ── Upstreams ─────────────────────────────────────────────────────────────────
# REST: menos conexões ativas; falha passiva (OSS): 2 erros em 10 s retiram a réplica por 10 s.
upstream bv_api {
    least_conn;
    server 127.0.0.1:3001 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:3002 max_fails=2 fail_timeout=10s;
    keepalive 32;
}
# Socket.IO: o cliente usa long-polling + upgrade para WebSocket (transports: polling, websocket); as requisições de um
# mesmo handshake precisam cair na MESMA réplica. Afinidade por IP do cliente (hash consistente: remover uma réplica não
# embaralha as demais). Alternativa sem afinidade: configurar o cliente com transports:['websocket'].
# Atenção: usuários atrás do mesmo NAT (ex.: rede do órgão) caem na mesma réplica — aceitável; o adapter Redis do
# Socket.IO (@socket.io/redis-adapter, já configurado na API) entrega eventos entre réplicas.
upstream bv_socket {
    hash $binary_remote_addr consistent;
    server 127.0.0.1:3001 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:3002 max_fails=2 fail_timeout=10s;
}

map $http_upgrade $bv_connection_upgrade { default upgrade; '' close; }

# Log SEM query string: tokens de uso único (ex.: /public/dsr/confirm?token=...) nunca vão para o disco.
log_format bv_main '$remote_addr - [$time_iso8601] "$request_method $uri" $status $body_bytes_sent '
                   'rt=$request_time urt=$upstream_response_time up=$upstream_addr';

# ── Limites ───────────────────────────────────────────────────────────────────
limit_req_zone  $binary_remote_addr zone=bv_general:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=bv_auth:10m    rate=5r/s;     # login/refresh/MFA
limit_req_zone  $binary_remote_addr zone=bv_public:10m  rate=30r/m;    # endpoints públicos (LGPD, webchat)
limit_conn_zone $binary_remote_addr zone=bv_conn:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name api.zapscript.me;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.zapscript.me;
    server_tokens off;

    access_log /var/log/nginx/balcao.access.log bv_main;
    error_log  /var/log/nginx/balcao.error.log warn;

    # ── TLS em trânsito ───────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.zapscript.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zapscript.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling desativado de propósito: a Let's Encrypt encerrou o OCSP (2025); com CA que ainda o ofereça,
    # habilitar `ssl_stapling on; ssl_stapling_verify on;` + `resolver`.

    # ── Cabeçalhos de segurança (HSTS: 2 anos; preload só após validar todos os subdomínios) ─
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    client_max_body_size 50m;           # anexos/áudio (igual ao nginx atual)
    client_body_timeout  30s;
    client_header_timeout 15s;
    send_timeout         60s;
    limit_conn bv_conn 40;              # conexões simultâneas por IP
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    # Parâmetros de proxy comuns (herdados por todos os locations que usam proxy_pass)
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_next_upstream error timeout http_502 http_503 http_504;   # POST não é reenviado em timeout (non_idempotent ausente)
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;

    # ── Saúde (usado por monitoramento externo e .github/workflows/tls-expiry.yml) ───────────
    location = /health {
        access_log off;
        proxy_pass http://bv_api;
        proxy_read_timeout 10s;
    }

    # ── WebSocket / Socket.IO ─────────────────────────────────────────────────
    # A API faz ping a cada 25 s (pingInterval) e aceita 60 s de silêncio (pingTimeout): 120 s de read_timeout cobre
    # com folga e libera conexões zumbis; subir só se o cliente mudar o heartbeat.
    location /socket.io/ {
        proxy_pass http://bv_socket;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $bv_connection_upgrade;
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_buffering     off;
        limit_req zone=bv_general burst=60 nodelay;
    }

    # ── Autenticação (força bruta) ────────────────────────────────────────────
    location /balcao/auth/ {
        limit_req zone=bv_auth burst=10 nodelay;
        proxy_pass http://bv_api;
        proxy_read_timeout 30s;
    }

    # ── Endpoints públicos (titular LGPD, webchat anônimo) ─────────────────────
    location /balcao/security/public/ {
        limit_req zone=bv_public burst=10 nodelay;
        proxy_pass http://bv_api;
        proxy_read_timeout 30s;
    }
    location /balcao/webchat/public/ {
        limit_req zone=bv_public burst=20 nodelay;
        proxy_pass http://bv_api;
        proxy_read_timeout 30s;
    }

    # ── Download da exportação integral (arquivos grandes, com Range) ───────────
    location ~ ^/balcao/security/(exports/[^/]+/download|dsr/[^/]+/export)$ {
        proxy_pass http://bv_api;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
        gzip off;                       # já é .tar.gz
        limit_req zone=bv_general burst=5 nodelay;
    }

    # ── Demais rotas (REST) ───────────────────────────────────────────────────
    location / {
        limit_req zone=bv_general burst=100 nodelay;
        proxy_pass http://bv_api;
        proxy_read_timeout 120s;
    }
}
