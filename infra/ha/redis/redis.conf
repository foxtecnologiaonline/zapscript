# Redis do Balcão — persistência e política exigidas pelo BullMQ/Socket.IO. Senha e masterauth vêm por linha de comando.
bind 0.0.0.0
protected-mode yes
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 900 1
save 300 100
# BullMQ exige noeviction (jamais descartar chaves de fila)
maxmemory-policy noeviction
# descomente e ajuste ao tamanho da VM (deixe folga para AOF rewrite/fork)
# maxmemory 1gb
min-replicas-to-write 0
repl-diskless-sync yes
tcp-keepalive 60
