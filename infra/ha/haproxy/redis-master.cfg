# HAProxy: encaminha TCP 6379 sempre ao Redis que se declara master (o Sentinel promove; o HAProxy segue em ~2 s).
# A API usa REDIS_URL=redis://:SENHA@redis-proxy:6379. Env vars são expandidas por HAProxy em strings entre aspas.
global
    maxconn 2000
defaults
    mode tcp
    timeout connect 3s
    timeout client  1h
    timeout server  1h
    timeout check   2s
resolvers docker
    nameserver dns1 127.0.0.11:53
    hold valid 5s
frontend redis_in
    bind *:6379
    default_backend redis_master
backend redis_master
    option tcp-check
    tcp-check connect
    tcp-check send "AUTH ${REDIS_PASSWORD}\r\n"
    tcp-check expect string +OK
    tcp-check send "INFO replication\r\n"
    tcp-check expect string role:master
    tcp-check send "QUIT\r\n"
    tcp-check expect string +OK
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server redis-master  redis-master:6379  check
    server redis-replica redis-replica:6379 check
