# Nginx — ZapScript API (api.zapscript.me)
# Copiar para: /etc/nginx/sites-available/zapscript
# Ativar com: ln -sf /etc/nginx/sites-available/zapscript /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name api.zapscript.me;

    # ACME challenge para Let's Encrypt (renovação automática)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.zapscript.me;

    # Certificados gerados pelo certbot
    ssl_certificate     /etc/letsencrypt/live/api.zapscript.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zapscript.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Uploads de áudio (max 50MB)
    client_max_body_size 50M;

    # Compressão (respostas JSON menores)
    gzip on;
    gzip_types application/json text/plain;

    # ── API REST ──────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ── Socket.IO (WebSocket para dashboard em tempo real) ────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
    }
}
