version: '3.9'

# ── ZapScript — Produção (Vultr São Paulo) ────────────────────────────────────
# Uso:
#   docker compose -f docker-compose.prod.yml up -d
#
# Pré-requisito: /opt/zapscript/.env preenchido

services:

  api:
    image: ghcr.io/foxtecnologiaonline/zapscript-api:latest
    container_name: zapscript-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"   # só loopback — Nginx faz o proxy externo
    env_file: /opt/zapscript/.env
    networks:
      - zapscript
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://localhost:3001/health',(r)=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  worker:
    image: ghcr.io/foxtecnologiaonline/zapscript-worker:latest
    container_name: zapscript-worker
    restart: unless-stopped
    env_file: /opt/zapscript/.env
    environment:
      API_URL: http://api:3001   # comunicação interna Docker
    networks:
      - zapscript
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: zapscript-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"   # loopback
    volumes:
      - redis_data:/data
    networks:
      - zapscript
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # evoapicloud substitui atendai (imagem antiga saiu do Docker Hub em
  # 2026-08 — "pull access denied", repo não existe mais nesse nome).
  # A v2 do Evolution API exige banco próprio (não roda mais com
  # DATABASE_ENABLED: false como a v1 rodava) — daí o evolution-postgres
  # dedicado abaixo, separado do Supabase de propósito (evita depender de
  # IPv6/pooler pra esse serviço específico, que já tem bastante coisa
  # crítica em cima — sessão do WhatsApp).
  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - zapscript
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # só loopback
    environment:
      SERVER_URL: https://api.zapscript.me
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"    # M6: não expor API key via GET /fetchInstances
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/evolution
      # REDIS_ENABLED (v1) não existe mais na v2 — fica sem efeito, e sem uma
      # variável CACHE_REDIS_* explícita a v2 tenta um Redis padrão que não
      # existe, em loop infinito de reconexão (bug conhecido da v2.3.6/2.3.7,
      # foi exatamente o que aconteceu aqui — via log ERROR [Redis] redis
      # disconnected, 2x/segundo, sem parar). Aponta pro redis que já existe
      # no compose, banco 6 (índice separado da fila do BullMQ, que usa o 0).
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://default:${REDIS_PASSWORD}@redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"   # instâncias ficam no volume em disco, não no Redis (deprecado pra isso)
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: "10"
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - zapscript
    depends_on:
      evolution-postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

volumes:
  evolution_data:
    driver: local
  evolution_postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  zapscript:
    driver: bridge
