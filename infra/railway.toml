# railway.toml — Deploy configuration for ZapScript
# Each service is deployed separately on Railway

# ── API Service ───────────────────────────────────────────────────
# Project: zapscript-api
# Start command: node apps/api/dist/index.js
# Build command: pnpm install && pnpm --filter database generate && pnpm --filter api build

# ── Worker Service ────────────────────────────────────────────────
# Project: zapscript-worker
# Start command: node apps/worker/dist/index.js
# Build command: pnpm install && pnpm --filter database generate && pnpm --filter worker build

[build]
builder = "nixpacks"
buildCommand = "npm install -g pnpm && pnpm install && npx prisma generate --schema=packages/database/prisma/schema.prisma"

[deploy]
healthcheckPath    = "/health"
healthcheckTimeout = 30
restartPolicyType  = "always"
