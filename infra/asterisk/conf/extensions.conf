; Todo inbound do tronco vai para o ARI (aplicação "balcao"). O controle da chamada é da API.
[from-trunk]
exten => _.,1,NoOp(Entrada ${EXTEN} de ${CALLERID(num)})
 same => n,Set(__BV_X_URA_OPTION=${PJSIP_HEADER(read,X-URA-Option)})
 same => n,Set(__BV_X_URA_ID=${PJSIP_HEADER(read,X-URA-Id)})
 same => n,Set(__BV_X_PROTOCOLO_0800=${PJSIP_HEADER(read,X-Protocolo-0800)})
 ; IP de origem do INVITE ("ip:porta"): a API confere contra URA_0800.allowedSourceIps (PUT /balcao/voice/ura0800)
 same => n,Set(__BV_SRC_ADDR=${CHANNEL(pjsip,remote_addr)})
 same => n,Stasis(balcao,in,${EXTEN})
 same => n,Hangup()

; Atendentes (WebRTC) não discam direto: ligações saem pela API (click-to-call / transbordo).
[agents]
exten => _.,1,NoOp(Discagem direta bloqueada para ${CALLERID(num)})
 same => n,Playback(ss-noservice)
 same => n,Hangup()

[default]
exten => _.,1,Hangup()
